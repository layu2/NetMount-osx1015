name: macOS Catalina (10.15) Intel build

on:
  push:
    branches:
      - build/macos-catalina-v1.2.4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-catalina-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Intel DMG (macOS 10.15+)
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS DMG
        run: pnpm tauri build --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NetMount-1.2.4-macos-catalina-x86_64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
