name: macOS Catalina (10.15) Intel build

on:
  push:
    branches:
      - build/macos-catalina-v1.2.4
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-catalina-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Intel DMG (macOS 10.15+)
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync application version
        run: node scripts/sync-version.mjs

      - name: Build macOS DMG
        run: pnpm exec tauri build --bundles dmg

      - name: Verify DMG app architecture and deployment target
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -n "$DMG_PATH"
          echo "Verifying DMG: $DMG_PATH"

          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet 2>/dev/null || true
            rmdir "$MOUNT_POINT" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          APP_PATH="$(find "$MOUNT_POINT" -name 'NetMount.app' -type d -print -quit)"
          test -n "$APP_PATH"
          APP_BIN="$APP_PATH/Contents/MacOS/netmount"
          test -f "$APP_BIN"

          ARCHS="$(lipo -archs "$APP_BIN")"
          echo "App architectures: $ARCHS"
          [[ " $ARCHS " == *" x86_64 "* ]]

          MIN_OS="$(otool -l "$APP_BIN" | awk '
            /cmd LC_BUILD_VERSION/ { in_cmd=1; next }
            in_cmd && /minos/ { print $2; exit }
            /cmd LC_VERSION_MIN_MACOSX/ { in_legacy=1; next }
            in_legacy && /version/ { print $2; exit }
          ')"
          echo "App minimum macOS: ${MIN_OS:-unknown}"
          test -n "$MIN_OS"
          python3 - "$MIN_OS" <<'PY'
          import sys
          def parts(value):
              return tuple(int(part) for part in value.split(".")[:3])
          minimum = parts(sys.argv[1])
          required = (10, 15, 0)
          if minimum > required:
              raise SystemExit(f"Binary requires macOS {sys.argv[1]}, newer than 10.15")
          PY

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NetMount-1.2.4-macos-catalina-x86_64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
